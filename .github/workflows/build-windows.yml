name: Build Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      USERNAMEGEN_DATA_DIR: ${{ runner.temp }}\UIsername-tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - name: JavaScript tests
        run: |
          node tests/test_i18n.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_search.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_features.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        run: python -m PyInstaller --noconfirm UIsername.spec
      - name: Package release
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: UIsername-Windows-x64
          path: release/*
          if-no-files-found: error
      - name: Create draft release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseFiles = @(Get-ChildItem -LiteralPath release -File | Select-Object -ExpandProperty FullName)
          gh release create "$env:RELEASE_TAG" @releaseFiles --verify-tag --draft --title "UIsername $env:RELEASE_TAG" --notes "Windows x64. Download UIsername.exe and double-click. Python included; language selection on first launch."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
